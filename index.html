#plotbar.bar{position:fixed;left:0;bottom:0;height:var(--plotH,150px);padding:6px 10px 8px;background:rgba(16,19,28,.97);border-top:2px solid var(--edge);z-index:3}
#plotbar.bar .plot{margin:0;display:flex;flex-direction:column;min-width:0;min-height:0;height:100%;overflow:hidden}
#plotbar.bar .plot canvas{flex:1 1 0;height:0;min-height:0}
#plotbar.bar .pt{white-space:nowrap;overflow:hidden;flex:none;gap:6px}
.legend b{font-weight:inherit}.legend .ls{display:none}.legend.short .lf{display:none}.legend.short .ls{display:inline}
#plotbar.bar .legend{flex:none;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;height:14px;line-height:14px;gap:5px}
.ttl{font-family:Silkscreen,"Cubic 11",monospace}
#hud{position:fixed;top:calc(10px + var(--safe-t));left:calc(10px + var(--safe-l));pointer-events:none;text-shadow:2px 2px 0 rgba(0,0,0,.5)}
#hud h1{font-family:Silkscreen,"Cubic 11",monospace;font-size:24px;margin:0;line-height:1;letter-spacing:1px}
#hud .clk{font-family:Silkscreen,"Cubic 11",monospace;font-size:15px;color:var(--accent);margin-top:4px}
#hud .sub{font-size:12px;color:#e8dcc0}
#card{position:fixed;left:calc(10px + var(--safe-l));top:calc(78px + var(--safe-t));width:250px;background:rgba(16,19,28,.9);border:2px solid var(--edge);padding:8px 10px;font-size:12px;display:none;box-shadow:4px 4px 0 rgba(0,0,0,.35)}
#card h3{font-family:Silkscreen,"Cubic 11",monospace;font-size:13px;margin:0 0 4px;display:flex;justify-content:space-between;gap:6px}
#card h3 button{font-size:11px;padding:0 6px;min-height:20px}
#card .now{color:var(--accent);margin:2px 0 5px}
#card ol{margin:0;padding-left:18px;color:var(--muted)}
#card li.cur{color:var(--ink)}
#card li.done{text-decoration:line-through;opacity:.6}
#toast{position:fixed;left:calc(10px + var(--safe-l));bottom:calc(58px + var(--plotOff,0px) + var(--safe-b));display:flex;flex-direction:column;gap:4px;pointer-events:none}
#toast div{background:rgba(16,19,28,.92);border:2px solid var(--accent);color:var(--ink);font-family:Silkscreen,"Cubic 11",monospace;font-size:12px;padding:4px 8px;animation:tin .2s}
@keyframes tin{from{transform:translateY(6px);opacity:0}}
#viewbar{position:fixed;left:calc(10px + var(--safe-l));bottom:calc(10px + var(--plotOff,0px) + var(--safe-b));display:flex;gap:2px}
button{font-family:"Pixelify Sans","Cubic 11",monospace;font-size:13px;color:var(--ink);background:#2f3340;border:0;padding:5px 9px;min-height:28px;cursor:pointer;box-shadow:inset 0 -2px 0 rgba(0,0,0,.35);border-radius:0}
button:hover{background:#474c5c}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
/* NetLogo-style interface panel */
#panel{position:fixed;top:0;right:0;bottom:0;background:rgba(16,19,28,.97);border-left:2px solid var(--edge);overflow-y:auto;padding:8px 10px 16px;scrollbar-width:thin}
#panel .tabs{display:none}
.grp{border:2px solid var(--edge);background:var(--panel);margin:0 0 8px;padding:6px 8px 8px;position:relative}
.grp>h2{font-family:Silkscreen,"Cubic 11",monospace;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--muted);margin:-2px 0 6px;display:flex;justify-content:space-between}
.grp>h2 .pend{color:var(--warn);text-transform:none;letter-spacing:0;font-family:"Pixelify Sans","Cubic 11";font-size:11px;display:none}
.grp.pending>h2 .pend{display:inline}
.row{display:flex;gap:4px;margin-bottom:5px;align-items:center}
.row>*{flex:1}
.btn-setup{background:#474c5c}
.btn-setup.need{background:var(--warn);color:#10131c}
.btn-go.on{background:var(--accent);color:#10131c}
.w{margin:0 0 6px}
.w .lab{display:flex;justify-content:space-between;font-size:12px;margin-bottom:1px}
.w .lab b{font-family:Silkscreen,"Cubic 11",monospace;font-weight:400;font-size:11px;color:var(--accent)}
.w .lab .pd{color:var(--warn);font-size:10px;margin-left:4px;display:none}
.w.pd .lab .pd{display:inline}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:16px;background:transparent;margin:0}

input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:16px;background:var(--hi);margin-top:-5px;border:0}
input[type=range]::-moz-range-track{height:6px;background:#474c5c}
input[type=range]::-moz-range-thumb{width:12px;height:16px;background:var(--hi);border:0;border-radius:0}
@media (pointer:coarse){input[type=range]{height:34px;touch-action:pan-y}input[type=range]::-webkit-slider-thumb{width:22px;height:26px;margin-top:-10px}input[type=range]::-moz-range-thumb{width:22px;height:26px}}
select,input[type=number]{width:100%;font-family:"Pixelify Sans","Cubic 11",monospace;font-size:13px;background:#2f3340;color:var(--ink);border:0;padding:4px 6px;border-radius:0}
.sw{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.sw button{min-width:52px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.seg button{padding:6px 0}
.seg button.on{background:var(--hi);color:#fff}
.sw button.on{background:var(--hi)}
.mon{display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.mon div{background:#10131c;border:1px solid var(--edge);padding:3px 5px}
.mon span{display:block;font-size:10px;color:var(--muted);line-height:1.1}
.mon b{font-family:Silkscreen,"Cubic 11",monospace;font-weight:400;font-size:14px}
.plot{margin-bottom:8px}
.plot .pt{font-size:11px;color:var(--muted);display:flex;justify-content:space-between}
.plot canvas{width:100%;height:96px;display:block;background:#10131c;border:1px solid var(--edge);image-rendering:pixelated}
.legend{display:flex;flex-wrap:wrap;gap:6px;font-size:10px;color:var(--muted);margin-top:2px}
.legend i{display:inline-block;width:8px;height:8px;margin-right:3px;vertical-align:middle}
.note{font-size:11px;color:var(--muted);margin:2px 0 0}
#sheetHandle{display:none}
#fallback{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px}
@media (max-width:859px){
  #panel{top:auto;left:0;right:0;height:52vh;border-left:0;border-top:2px solid var(--edge);padding:0 8px calc(10px + var(--safe-b));transition:transform .25s}
  #panel.closed{transform:translateY(calc(52vh - 88px))}
  #sheetHandle{display:flex;justify-content:center;padding:4px 0 2px;position:sticky;top:0;background:var(--bg);z-index:2}
  #sheetHandle i{width:44px;height:5px;background:#474c5c;display:block}
  #panel .tabs{display:flex;gap:2px;position:sticky;top:11px;background:var(--bg);z-index:2;padding-bottom:6px}
  #panel .tabs button{flex:1;font-size:12px;padding:5px 2px}
  #panel .tabs button.on{background:var(--hi)}

  .grp[data-tab].show{display:block}
  #monGrp{display:block!important}
  .mon{grid-template-columns:repeat(6,1fr)}
  .mon b{font-size:12px}
  .mon span{font-size:9px}
  #hud h1{font-size:18px}
  #card{width:210px}
  #toast{bottom:auto;top:calc(80px + var(--safe-t))}
  #viewbar{bottom:auto;top:calc(10px + var(--safe-t));left:auto;right:calc(10px + var(--safe-r))}
  #plotbar{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<canvas id="c" aria-label="Pixel-art gym diorama"></canvas>
<div id="hud"><h1>gymsim</h1><div class="clk" id="hudClock">05:45</div><div class="sub" id="hudSub">Drag to pan · tap someone to follow them</div></div>
<div id="card"></div>
<div id="toast"></div>
<div id="viewbar"><button id="rotL" aria-label="Rotate left">⟲</button><button id="rotR" aria-label="Rotate right">⟳</button><button id="zoomOut" aria-label="Zoom out">−</button><button id="zoomIn" aria-label="Zoom in">+</button><button id="langBtn" aria-label="Language / 語言"><span data-l="en">En</span> / <span data-l="zh">中文</span></button></div>
<aside id="panel"></aside>
<div id="fallback">This diorama needs WebGL, which isn't available in this browser.</div>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
<script type="module">
import * as THREE from 'three';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ================================================================ utils
const V3 = THREE.Vector3;
const UP = new V3(0, 1, 0);
const clamp = (x, a, b) => Math.max(a, Math.min(b, x));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const smooth = (t) => t * t * (3 - 2 * t);
const wrap = (a) => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
function gauss() { let u = 0, v = 0; while (!u) u = Math.random(); while (!v) v = Math.random(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }
function h3(a, b, c) { const s = Math.sin(a * 12.9898 + b * 78.233 + c * 37.719) * 43758.5453; return s - Math.floor(s); }
const norm3 = (v) => { const l = Math.hypot(v[0], v[1], v[2]) || 1; return [v[0] / l, v[1] / l, v[2] / l]; };

// ================================================================ court constants (metres)
const BASE = 11.885, SGL = 4.115, DBL = 5.485, SVC = 6.40, POST = 6.40;
const FX = 18.3, FZ = 9.15;           // fence half sizes (36.6 x 18.3)
const R = 0.0335;                     // ball radius
const G = 9.81;
function netH(z) { const a = Math.min(1, Math.abs(z) / POST); return 0.914 + (1.07 - 0.914) * a * a; }

// ================================================================ environment state
const env = { raining: false, rainAmt: 0, wet: 0, wind: 0.5, heat: 0 };
function makeRng(seed) { let a = seed >>> 0; const f = () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; f.range = (lo, hi) => lo + f() * (hi - lo); f.int = (lo, hi) => Math.floor(lo + f() * (hi - lo + 1)); f.pick = (arr) => arr[Math.floor(f() * arr.length)]; f.gauss = () => { let u = 0, v = 0; while (!u) u = f(); while (!v) v = f(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); }; f.chance = (p) => f() < p; return f; }

// ================================================================ renderer
const canvas = document.getElementById('c');
let renderer;
try {
  renderer = new THREE.WebGLRenderer({ canvas, antialias: false, powerPreference: 'high-performance' });
} catch (e) {
  document.getElementById('fallback').style.display = 'flex';
  throw e;
}
const DPR = Math.min(window.devicePixelRatio || 1, 2);
renderer.setPixelRatio(DPR);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.BasicShadowMap;
renderer.setClearColor(0x000000, 1);

const scene = new THREE.Scene();
// ---------------------------------------------------------------- the board: everything outside a ragged, grid-stepped boundary dissolves away.
// Streets run on past the edge for a while so the city doesn't end abruptly. Implemented by repurposing the fog chunks
// (every built-in material includes them), so it costs one test per pixel and needs no per-object work.
const BOARD = { x: 54, zN: -50, zS: 52 };
scene.fog = new THREE.Fog(0x000000, 50, 2e9); scene.fog.color.setRGB(54, 52, 54);   // board extents, see boardOut()
THREE.ShaderChunk.fog_pars_vertex = '#ifdef USE_FOG\nvarying vec3 vBoardW;\n#endif';
THREE.ShaderChunk.fog_vertex = '#ifdef USE_FOG\n vec4 bwp = vec4(transformed, 1.0);\n #ifdef USE_INSTANCING\n bwp = instanceMatrix * bwp;\n #endif\n vBoardW = (modelMatrix * bwp).xyz;\n#endif';
THREE.ShaderChunk.fog_pars_fragment = `#ifdef USE_FOG
varying vec3 vBoardW; uniform vec3 fogColor; uniform float fogNear; uniform float fogFar;
float bHash(vec2 p) { return fract(sin(dot(p, vec2(127.1, 311.7))) * 43758.5453); }
float bBayer(vec2 p) { vec2 q = mod(floor(p), 4.0); int i = int(q.x) + int(q.y) * 4;
  float m[16]; m[0]=0.;m[1]=8.;m[2]=2.;m[3]=10.;m[4]=12.;m[5]=4.;m[6]=14.;m[7]=6.;m[8]=3.;m[9]=11.;m[10]=1.;m[11]=9.;m[12]=15.;m[13]=7.;m[14]=13.;m[15]=5.;
  for (int k = 0; k < 16; k++) if (k == i) return (m[k] + 0.5) / 16.0; return 0.5; }
float boardOut(vec2 xz) {
  // extents per side come in through the fog uniforms: fogColor = (east, south, west), fogNear = north (all distances from the centre)
  float bE = fogColor.r, bS = fogColor.g, bW = fogColor.b, bN = fogNear;
  vec2 cell = floor(xz / 4.0);
  float j = bHash(cell) * 7.0;                                                  // ragged, grid-stepped edge
  float d = max(max(xz.x - (bE + j), -xz.x - (bW + j)), max(xz.y - (bS + j), -xz.y - (bN + j)));
  float rowJ = bHash(vec2(floor(xz.y / 3.0), 7.0)) * 12.0, colJ = bHash(vec2(floor(xz.x / 3.0), 3.0)) * 10.0;
  if ((xz.y > 19.8 && xz.y < 36.2) || abs(xz.y + 29.0) < 4.7) d = min(d, max(xz.x - (bE + 14.0 + rowJ), -xz.x - (bW + 14.0 + rowJ)));   // main and back streets lead out
  if (abs(abs(xz.x) - 36.0) < 2.4) d = min(d, max(xz.y - (bS + 12.0 + colJ), -xz.y - (bN + 12.0 + colJ)));                       // side lanes too
  return d;
}
#endif`;
THREE.ShaderChunk.fog_fragment = `#ifdef USE_FOG
{ float bd = boardOut(vBoardW.xz); if (bd > 0.0 && (bd > 5.0 || bBayer(gl_FragCoord.xy) < bd / 5.0)) discard; }
#endif`;
const world = new THREE.Group(); scene.add(world);
const under = new THREE.Group(); world.add(under);   // island underside + clouds (hidden in reflections)

const cam = new THREE.OrthographicCamera(-1, 1, 1, -1, 20, 320);
const view = { az: Math.PI / 4, azT: Math.PI / 4, el: Math.atan(0.5), zoom: 1.2, zoomT: 1.2, target: new V3(0, 0, 0.8), baseH: 34, follow: null };
let pix = 3, rtW = 2, rtH = 2, aspect = 1;
let rtMain = null, rtPost = null, rtRefl = null;

// ---------------------------------------------------------------- 64 colour palette (sRGB), matched in OKLab
const PAL_HEX = [
  '#0d0f14', '#1c1f2a', '#2f3340', '#474c5c', '#6b7182', '#959bab', '#c4c9d4', '#f2f1ea',
  '#fff8e6', '#e8dcc0', '#cbb994',
  '#10241a', '#1a3a22', '#24552b', '#317033', '#448c3a', '#63a845', '#8cc456', '#bfe07a',
  '#0f2e26', '#1b4a3b', '#2c6a52',
  '#4a1e14', '#6e2c1a', '#93401f', '#b85628', '#d36f36', '#e08f5a', '#eab38a',
  '#2b1a12', '#45291b', '#643c24', '#87552f', '#a9733f', '#c99a5e',
  '#3b3532', '#5a524c', '#7d746a',
  '#0b1a33', '#13305a', '#1e4a85', '#2f68ab', '#4a8acb', '#74abe0', '#a5cdf0', '#d5ebfb',
  '#5c1418', '#9b2226', '#d6403a',
  '#6b5a10', '#b8a21e', '#dfe03a', '#f6f79a',
  '#5a3825', '#8a5a3c', '#b5805a', '#d9a77e', '#f0caa4',
  '#2a1838', '#4d2a5e', '#8a4f7d', '#d07a8e',
  '#f0a060', '#ffd08a',
  '#7a5a0e', '#c4901a', '#f2c230'   // warm taxi yellows (the lemon yellow above reads green on a car body)
];
const s2l = (c) => c <= 0.04045 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
function hexSrgb(h) { const n = parseInt(h.slice(1), 16); return [(n >> 16 & 255) / 255, (n >> 8 & 255) / 255, (n & 255) / 255]; }
function oklab(r, g, b) {
  const l = Math.cbrt(0.4122214708 * r + 0.5363325363 * g + 0.0514459929 * b);
  const m = Math.cbrt(0.2119034982 * r + 0.6806995451 * g + 0.1073969566 * b);
  const s = Math.cbrt(0.0883024619 * r + 0.2817188376 * g + 0.6299787005 * b);
  return [0.2104542553 * l + 0.7936177850 * m - 0.0040720468 * s, 1.9779984951 * l - 2.4285922050 * m + 0.4505937099 * s, 0.0259040371 * l + 0.7827717662 * m - 0.8086757660 * s];
}
const palSRGB = [], palLab = [];
for (const h of PAL_HEX) { const c = hexSrgb(h); palSRGB.push(new V3(c[0], c[1], c[2])); const L = oklab(s2l(c[0]), s2l(c[1]), s2l(c[2])); palLab.push(new V3(L[0], L[1], L[2])); }
const linCol = (hex) => { const c = hexSrgb(hex); return new V3(s2l(c[0]), s2l(c[1]), s2l(c[2])); };

// ---------------------------------------------------------------- post: outlines + palette at low res, then nearest upscale
const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tColor: { value: null }, tDepth: { value: null }, res: { value: new THREE.Vector2(1, 1) },
    pal: { value: palSRGB }, palLab: { value: palLab }, thr: { value: 0.0013 }, exposure: { value: 1 },
    skyTop: { value: new V3() }, skyBot: { value: new V3() }, night: { value: 0 },
    skyHor: { value: new V3() }, sunCol: { value: new V3() }, sunP: { value: new V3() }, moonP: { value: new V3() }, tSec: { value: 0 }, cover: { value: 0.35 }, rainy: { value: 0 },
    setting: { value: 0 }, shift: { value: new THREE.Vector2() }, landA: { value: new V3() }, landB: { value: new V3() }, horizon: { value: 0.8 },
    glowCol: { value: new V3(1.0, 0.72, 0.4) }, glowAmt: { value: 0.4 }, glowMul: { value: 0.0 }
  },
  vertexShader: 'varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }',
  fragmentShader: `
    precision highp float;
    uniform sampler2D tColor; uniform sampler2D tDepth; uniform vec2 res;
    uniform vec3 pal[67]; uniform vec3 palLab[67]; uniform float thr; uniform float exposure;
    uniform vec3 skyTop; uniform vec3 skyBot; uniform float night;
    uniform vec3 skyHor; uniform vec3 sunCol; uniform vec3 sunP; uniform vec3 moonP; uniform float tSec; uniform float cover; uniform float rainy;
    uniform float setting; uniform vec2 shift; uniform vec3 landA; uniform vec3 landB; uniform float horizon;
    uniform vec3 glowCol; uniform float glowAmt; uniform float glowMul;
    varying vec2 vUv;
    vec3 toLab(vec3 c){ c=max(c,vec3(0.0));
      float l=0.4122214708*c.r+0.5363325363*c.g+0.0514459929*c.b;
      float m=0.2119034982*c.r+0.6806995451*c.g+0.1073969566*c.b;
      float s=0.0883024619*c.r+0.2817188376*c.g+0.6299787005*c.b;
      l=pow(l,1.0/3.0); m=pow(m,1.0/3.0); s=pow(s,1.0/3.0);
      return vec3(0.2104542553*l+0.7936177850*m-0.0040720468*s, 1.9779984951*l-2.4285922050*m+0.4505937099*s, 0.0259040371*l+0.7827717662*m-0.8086757660*s); }
    vec3 nearestPal(vec3 lin){ vec3 lab=toLab(lin); float best=1e9; vec3 o=pal[0];
      for(int i=0;i<67;i++){ vec3 d=lab-palLab[i]; d.x*=1.15; float dd=dot(d,d); if(dd<best){best=dd;o=pal[i];} } return o; }
    float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
    float n1(float x){ float i=floor(x), f=fract(x); return mix(hash(vec2(i,0.0)), hash(vec2(i+1.0,0.0)), f*f*(3.0-2.0*f)); }
    float n2(vec2 p){ vec2 i=floor(p), f=fract(p); vec2 u=f*f*(3.0-2.0*f); return mix(mix(hash(i),hash(i+vec2(1.0,0.0)),u.x), mix(hash(i+vec2(0.0,1.0)),hash(i+vec2(1.0,1.0)),u.x), u.y); }
    float fbm(vec2 p){ float sm=0.0, a=0.5; for(int i=0;i<4;i++){ sm+=a*n2(p); p*=2.03; a*=0.5; } return sm; }
    // the backdrop behind the board: sky with sun and moon on their daily arcs, drifting clouds, a horizon
    // with the setting's own skyline (city blocks, low hills, mountains), and hazy land below it
    vec3 backdrop(vec2 uv){
      float asp = res.x / res.y, H = horizon;
      vec2 q = vec2(uv.x * asp, uv.y); float sx = q.x + shift.x;
      float k = clamp((uv.y - H) / (1.0 - H), 0.0, 1.0);
      vec3 sky = mix(skyHor, skyBot, smoothstep(0.0, 0.35, k)); sky = mix(sky, skyTop, smoothstep(0.25, 1.0, k));
      vec2 sp = vec2(sunP.x * asp, sunP.y); float ds = length(q - sp);
      sky += sunCol * (0.45 * exp(-ds * 5.0)) * sunP.z;
      if (night > 0.5 && uv.y > H + 0.06 && hash(floor(uv * res)) > 0.996) sky = vec3(0.75);
